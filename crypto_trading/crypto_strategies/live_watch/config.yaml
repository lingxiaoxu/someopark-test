# live_watch — sizing / arming / kill rules for the four watchlist candidates.
# EVERYTHING ships disabled. Arming = set enabled: true here AND open the
# global execution gates (prod key + ALLOW_LIVE_ORDERS=1). Until then every
# run is a logged dry-run.
#
# Registered 2026-08-10. Frozen strategy parameters live in the code of each
# module (they mirror the watchlist registration exactly) — this file only
# controls money and safety, never signal logic.

subaccount: 64            # real account's perps subaccount (verified 2026-07-12)
demo_mirror: false        # true → every emitted perp order is ALSO sent to the
                          # demo venue (KXBTCPERP1/subaccount 0); paper loop
                          # unchanged. W5 events mirror has its own flag below.

w1_basis:                 # S1 basis-selective, BTC
  enabled: false
  contracts: 10           # ≈ $64 notional at BTC perp ~6.4
  max_cum_loss_usd: 30    # disarm if realized cum net worse after >=40 trades
  min_trades_for_kill: 40

w2_chronos:               # S8 Chronos 4h, BTC + ETH
  enabled: false
  contracts: 10
  max_cum_loss_usd: 40
  min_trades_for_kill: 30

w3_mom24:                 # S9 24h momentum, majors only for live (depth)
  enabled: false
  contracts: 10
  tickers: [KXBTCPERP, KXETHPERP, KXSOLPERP, KXXRPPERP]
  max_cum_loss_usd: 40
  min_trades_for_kill: 30

w4_carry:                 # S3-improved same-asset hedged carry, BTC
  enabled: false
  paper_hedge: true       # ON 2026-08-26: open the VIRTUAL hedged position
                          # without a real spot fill so the probe produces a
                          # P&L curve (a real position still needs
                          # --confirm-spot). Backtest comparand: +3~9%/yr.
  demo_mirror: false      # OFF 2026-08-26 (user): demo P&L is structurally
                          # meaningless (no near-term book, alien index/fees);
                          # the paper hedge account is W4's real scoreboard
  contracts: 100          # ≈ $640/leg — the pilot size discussed
  # kill/exit: trailing 30d settled funding sum < 0  (the frozen stop)
  # spot leg is EXTERNAL (Coinbase/Kraken): module emits explicit instructions;
  # it never assumes the spot fill happened — you confirm via --spot-filled.

w5_knockdown:             # knockdown replication, KXBTC hourly binaries
  enabled: false          # events-API wiring is the arming step (separate)
  contracts: 25           # virtual/paper sizing during the capture probe
  demo_mirror: false      # OFF 2026-08-26 (user): strategy archived after the
                          # settlement-bug re-verdict; probe stays for observation
  max_cum_loss_usd: 50
  min_trades_for_kill: 40
  # LIVE criteria (watchlist): probe capture_rate >= 0.25 over >= 7 days AND
  # paper mean pnl per contract within 50% of the backtest's +24.5c

w6_residual:              # N2-residual jump lead-lag, BTC+ETH perps
  enabled: false
  contracts: 10           # ≈$64 notional/leg
  max_cum_loss_usd: 30
  min_trades_for_kill: 40
  # LIVE criteria (watchlist): post-registration n >= 60 AND netTT NW-t >= 2
  # AND ex-best-day still positive AND live entry slippage vs backtest < 3bps

w7_noisefade:             # v3 RE-FROZEN 2026-08-31 (user): symmetric-favorite
                          # FLB on 15M — buy WHICHEVER side is the favorite
                          # ~8min out, band [0.60,0.98]; [0.50,0.60) recorded
                          # as an observation leg outside the books. v2
                          # (favorite-NO only) closed at 259 windows -2.76c
                          # and its rescan showed the up-tilt itself died.
  enabled: false          # prod path does not even exist — paper + demo mirror
  demo_mirror: true       # user 2026-08-31: mirror ALL band entries, favorite
                          # side as-is — unified band, no demo special-casing
  contracts: 25
  # EVIDENCE kill (2026-08-29, user-approved): paper probes burn no money, so
  # dollar stops only ever fire on noise (they did, twice). v3 judges the kill
  # on the PRE-REGISTERED PRIMARY CELL [0.85,0.98]: window-clustered t <= -2
  # with >= 30 primary windows. The dollar fields below are ignored by w7.
  max_cum_loss_usd: 999999
  min_trades_for_kill: 999999
  # LIVE criteria (v3, pre-registered 2026-08-31): PRIMARY cell [0.85,0.98]
  # both sides, taker book — >= 300 independent primary windows AND mean > 0
  # AND window-clustered t >= 2.5 (~61 primary windows/day -> ~5 days). The
  # wide band is a MAP (its +0.54c mean would need ~14,700 windows for t 2.5);
  # judging any other bucket requires a NEW pre-registration in the plan doc.
  # Maker parallel book is a measurement, never a trading mode (backtest:
  # -10.6c t -5.3, adverse selection). Five coins = one macro bet.
